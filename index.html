<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>iKM-Übung Mathematik</title>
<style>
/* Layout: eine schmale Spalte, eine Sache pro Bildschirm, eine Akzentfarbe. */
:root {
  --bg: #FFFFFF; --surface: #F4F6F9; --ink: #16202B; --muted: #5A6878; --line: #D8DEE6;
  --accent: #1F5FBF; --accent-soft: #E9F0FB; --on-accent: #FFFFFF;
  --ok: #1E7A46; --ok-bg: #E7F4EC; --bad: #B3362B; --bad-bg: #FBECEA;
  --c1: #2B5C9E; --c2: #A9BDD6; --c3: #2E8B57; --grid-strong: #C9D2DD; --card: #FFFFFF;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181F; --surface: #1B232D; --ink: #E8EDF3; --muted: #A0B0C2; --line: #2E3A48;
    --accent: #7FB0F5; --accent-soft: #1D2F4A; --on-accent: #0E1620;
    --ok: #6CC48F; --ok-bg: #17331F; --bad: #F08A7E; --bad-bg: #3A1F1D;
    --c1: #7FB0F5; --c2: #47617F; --c3: #6CC48F; --grid-strong: #34424F; --card: #12181F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181F; --surface: #1B232D; --ink: #E8EDF3; --muted: #A0B0C2; --line: #2E3A48;
  --accent: #7FB0F5; --accent-soft: #1D2F4A; --on-accent: #0E1620;
  --ok: #6CC48F; --ok-bg: #17331F; --bad: #F08A7E; --bad-bg: #3A1F1D;
  --c1: #7FB0F5; --c2: #47617F; --c3: #6CC48F; --grid-strong: #34424F; --card: #12181F;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1080px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; margin: 0 .15em; font-size: .95em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em; }
.frac > span:last-child { padding: 0 .2em; }

/* Start */
h1 { font-size: clamp(28px, 5vw, 36px); line-height: 1.15; margin: 32px 0 10px; letter-spacing: -.01em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 28px; max-width: 34em; }
.form { display: grid; grid-template-columns: minmax(0, 1fr) 110px 150px; gap: 12px; max-width: 620px; margin: 0 0 16px; }
#inCode { text-transform: uppercase; letter-spacing: .08em; }
.form label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
.form input, .numrow input, select, textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 11px 12px; font-size: 17px; }
.form input:focus, .numrow input:focus { border-color: var(--accent); }
.btn { border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 11px 20px; border-radius: 8px; font-weight: 600; font-size: 17px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 6px 12px; font-size: 15px; }
.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 8px 2px; font-size: 15px; }
.home { background: none; border: 1.5px solid var(--line); border-radius: 6px; padding: 4px 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.home:hover, .btn.ghost:hover { border-color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.hello { font-size: 19px; margin: 0 0 18px; }
.other { margin: 18px 0 0; }
.rules { margin: 28px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 15px; display: grid; gap: 4px; max-width: 34em; }
.teacherlink { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
.warn { color: var(--bad); font-weight: 600; margin: 10px 0 0; font-size: 15px; }
#warn { min-height: 1.5em; }
#startWarn { margin: 0 0 12px; }
#startWarn:empty { display: none; }

/* Aufgabe */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0; }
.barrow { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; color: var(--muted); }
.barrow #pos { margin-right: auto; }
#clock { font-variant-numeric: tabular-nums; color: var(--ink); }
#clock.low { color: var(--bad); }
.track { height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.track > div { height: 100%; background: var(--accent); transition: width .3s ease; }
.topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; }
.stem { font-size: 18px; margin-top: 8px; }
.stem p { margin: 0 0 10px; }
.q { font-weight: 600; font-size: 20px; line-height: 1.35; margin: 18px 0 14px; }
.fig { margin: 14px 0 6px; overflow-x: auto; }
.fig svg { display: block; max-width: 100%; height: auto; }
svg text { fill: var(--ink); font-family: var(--font); }
.opts { display: grid; gap: 8px; }
.opts.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 17px; width: 100%; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .l { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .l { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.figopt { flex-direction: column; align-items: stretch; }
.opt.figopt .l { align-self: flex-start; }
.opt.figopt svg { width: 100%; height: auto; max-width: none !important; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled, .months button:disabled, table.rf td.c button:disabled { cursor: default; }
.tblwrap { overflow-x: auto; }
table.rf { border-collapse: collapse; width: 100%; font-size: 16px; }
table.rf th, table.rf td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: middle; }
table.rf th { background: var(--surface); font-size: 14px; }
table.rf .c { text-align: center; width: 80px; }
table.rf td.c button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--bg); padding: 0; font-weight: 700; }
table.rf td.c button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
table.rf tr.ok td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
table.rf tr.bad td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
table.rf td.why { font-size: 14px; color: var(--muted); min-width: 160px; }
.months { display: flex; flex-wrap: wrap; gap: 8px; }
.months button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 13px; font-weight: 600; font-size: 15px; }
.months button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.months button.ok { border-color: var(--ok); background: var(--ok-bg); }
.months button.bad { border-color: var(--bad); background: var(--bad-bg); }
.numrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.numrow input { width: 200px; font-size: 19px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.sub { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
.formula { font-size: 20px; font-weight: 600; }
.pricelist, .receipt, .offer { background: var(--surface); border-radius: 8px; padding: 12px 16px; }
.pricelist table { border-collapse: collapse; } .pricelist td { padding: 2px 16px 2px 0; } .pricelist td:last-child { text-align: right; font-weight: 600; }
.receipt { font-family: ui-monospace, "Courier New", Courier, monospace; font-size: 15px; max-width: 260px; }
.receipt .ring { border: 2px solid var(--bad); border-radius: 50%; padding: 0 5px; }
.figrow { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.offer { display: inline-block; font-size: 20px; font-weight: 600; line-height: 1.6; padding: 14px 22px; }
table.plain { border-collapse: collapse; font-size: 16px; }
table.plain th, table.plain td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; }
table.plain th { background: var(--surface); }

/* Auswertung */
.who { color: var(--muted); font-weight: 600; font-size: 15px; margin: 8px 0 0; }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 2px 0 6px; }
.score .big { font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.score .of { font-size: 18px; color: var(--muted); font-weight: 600; }
.meta { color: var(--muted); margin: 0 0 20px; max-width: 38em; }
.status { padding: 12px 14px; border-radius: 8px; background: var(--surface); font-size: 15px; }
.status.sent { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.status textarea { display: block; width: 100%; font-family: ui-monospace, "Courier New", Courier, monospace; font-size: 14px; min-height: 76px; margin: 8px 0; word-break: break-all; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.col h2 { margin: 0 0 12px; font-size: 17px; }
.topics { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.topics .t { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 15px; }
.topics .t span:last-child { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.topics .b { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.topics .b div { height: 100%; }
.good .b div { background: var(--ok); }
.work .b div { background: var(--bad); }
.topics p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.none { color: var(--muted); font-size: 15px; margin: 0; }
h2.sec { font-size: 17px; margin: 36px 0 4px; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.item { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 6px; font-size: 16px; font-variant-numeric: tabular-nums; }
.item.r { border-color: var(--ok); } .item.r span { color: var(--ok); }
.item.f { border-color: var(--bad); } .item.f span { color: var(--bad); }
.item span { font-weight: 700; }
.yours { margin: 18px 0 0; font-weight: 600; }
.yours.ok { color: var(--ok); } .yours.bad { color: var(--bad); }
.sol { background: var(--ok-bg); border-radius: 8px; padding: 14px 16px; margin-top: 12px; }
.sol h3 { margin: 0 0 6px; font-size: 16px; }
.sol p { margin: 0 0 8px; } .sol p:last-child { margin-bottom: 0; }
.msg { font-size: 15px; color: var(--muted); margin: 8px 0 0; }

/* Lehrer-Ansicht */
.roombox { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; background: var(--surface); border-radius: 8px; padding: 16px 18px; margin-top: 16px; }
.roombox .lbl { display: block; font-size: 14px; color: var(--muted); font-weight: 600; }
.roombox .code { font-size: 44px; font-weight: 700; letter-spacing: .08em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.roombox .info { flex: 1 1 280px; min-width: 0; font-size: 15px; }
.roombox .info p { margin: 0 0 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.t-sec { margin: 32px 0 0; }
.t-sec h2 { font-size: 22px; margin: 0 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
.cardn { background: var(--surface); border-radius: 8px; padding: 12px 14px; }
.cardn b { display: block; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.cardn span { font-size: 14px; color: var(--muted); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.t tr:last-child td { border-bottom: none; }
table.t th { background: var(--surface); font-size: 13px; }
table.t td.n { text-align: center; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--accent-soft); }
.yes, .no, .run { display: inline-block; border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 13px; }
.yes { background: var(--ok-bg); color: var(--ok); }
.no { background: var(--bad-bg); color: var(--bad); }
.run { background: var(--accent-soft); color: var(--ink); }
.codes textarea { width: 100%; min-height: 90px; font-family: ui-monospace, "Courier New", Courier, monospace; font-size: 14px; }
.detail { margin-top: 14px; border: 1.5px solid var(--accent); border-radius: 8px; padding: 16px 18px; }
.detail h3 { margin: 0 0 8px; font-size: 19px; }
.tasks { columns: 2; column-gap: 24px; font-size: 15px; margin: 8px 0 14px; padding: 0; list-style: none; }
.tasks li { break-inside: avoid; padding: 2px 0; }
.tasks .m { display: inline-block; width: 22px; font-weight: 700; }
@media (max-width: 640px) {
  .opts.grid2, .split, .form { grid-template-columns: minmax(0, 1fr); }
  .tasks { columns: 1; }
  table.rf .c { width: 56px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
[hidden] { display: none !important; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 520px; margin: 0 0 28px; }
.fact { background: var(--surface); border-radius: 10px; padding: 14px 16px; }
.fact b { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 14px; color: var(--muted); }
.comps { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.comps li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.comps .h { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; }
.chip { flex: none; border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 700; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.comps .b { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.comps .b div { height: 100%; }
.comps .ok-b div { background: var(--ok); } .comps .bad-b div { background: var(--bad); }
.comps .n { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.comps .tip { margin: 6px 0 0; font-size: 15px; }
.confirm { background: var(--surface); border-radius: 10px; padding: 16px; margin-top: 20px; }
.confirm p { margin: 0 0 12px; font-weight: 600; }
@media (max-width: 460px) { .facts { grid-template-columns: minmax(0, 1fr); } .fact { display: flex; align-items: baseline; gap: 10px; } }
.pools { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; max-width: 520px; margin: 0 0 22px; }
.pool { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.pool b { font-size: 19px; } .pool span { font-size: 14px; color: var(--muted); }
.pool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<div class="wrap">
  <section id="start"></section>
  <section id="task" hidden>
    <div class="bar"><div class="barrow"><button class="home" data-act="home">Startseite</button><span id="pos"></span><span id="clock"></span></div><div class="track"><div id="trackfill"></div></div></div>
    <div id="sheet" aria-live="polite"></div>
  </section>
  <section id="result" hidden></section>
  <section id="review" hidden></section>
  <section id="teacher" hidden></section>
</div>
<script>
(function () {
  "use strict";
  const F = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  /* ---------- SVG helpers ---------- */
  function barChart(o) {
    const W = o.w || 680, H = o.h || 300, L = 56, B = o.rotate ? 70 : 40, T = o.title ? 34 : 14, R = 12;
    const pw = W - L - R, ph = H - T - B, n = o.cats.length, ns = o.series.length;
    const y = (v) => T + ph - (v / o.max) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${esc(o.label || o.title || "Diagramm")}">`;
    if (o.title) s += `<text x="${W / 2}" y="20" text-anchor="middle" font-size="15" font-weight="700">${o.title}</text>`;
    for (let v = 0; v <= o.max + 1e-9; v += o.step) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid-strong)" stroke-width="1"/>`;
      s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12">${String(v).replace(".", ",")}</text>`;
    }
    if (o.ylabel) s += `<text transform="translate(14 ${T + ph / 2}) rotate(-90)" text-anchor="middle" font-size="12">${o.ylabel}</text>`;
    const gw = pw / n, bw = (gw * 0.72) / ns;
    o.cats.forEach((c, i) => {
      o.series.forEach((se, k) => {
        const v = se.vals[i], x = L + i * gw + gw * 0.14 + k * bw;
        s += `<rect x="${x}" y="${y(v)}" width="${bw - 1}" height="${T + ph - y(v)}" fill="${se.color}"/>`;
        if (o.values) s += `<text x="${x + bw / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="12" font-weight="700">${v}</text>`;
      });
      const cx = L + (i + 0.5) * gw, cy = T + ph + 16;
      s += o.rotate ? `<text transform="translate(${cx} ${cy}) rotate(-40)" text-anchor="end" font-size="12">${c}</text>`
        : `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="12">${c}</text>`;
    });
    s += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--ink)" stroke-width="1.5"/>`;
    if (o.legend) {
      let lx = L + 6;
      o.series.forEach((se) => { s += `<rect x="${lx}" y="${T - 2}" width="12" height="12" fill="${se.color}"/><text x="${lx + 16}" y="${T + 8}" font-size="12">${se.name}</text>`; lx += 30 + se.name.length * 7; });
    }
    return s + "</svg>";
  }
  function graph(o) {
    const W = o.w || 420, H = o.h || 320, L = 46, B = 40, T = 26, R = 30;
    const pw = W - L - R, ph = H - T - B;
    const X = (v) => L + (v / o.xmax) * pw, Y = (v) => T + ph - (v / o.ymax) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${esc(o.label || "Graph")}">`;
    for (let v = o.xstep; v <= o.xmax + 1e-9; v += o.xstep) s += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T + ph}" stroke="var(--grid-strong)" stroke-dasharray="3 3"/>`;
    for (let v = o.ystep; v <= o.ymax + 1e-9; v += o.ystep) s += `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid-strong)" stroke-dasharray="3 3"/>`;
    s += `<line x1="${L}" y1="${T + ph}" x2="${L + pw + 18}" y2="${T + ph}" stroke="var(--ink)" stroke-width="1.6"/><polygon points="${L + pw + 22},${T + ph} ${L + pw + 12},${T + ph - 5} ${L + pw + 12},${T + ph + 5}" fill="var(--ink)"/>`;
    s += `<line x1="${L}" y1="${T + ph}" x2="${L}" y2="${T - 14}" stroke="var(--ink)" stroke-width="1.6"/><polygon points="${L},${T - 18} ${L - 5},${T - 8} ${L + 5},${T - 8}" fill="var(--ink)"/>`;

    if (left() <= 0) { finish(true); return; }
    const t = byId(cur());
    let g = sel; if (t.type === "num") g = $("numIn").value.trim();
    if (!skip) {
      const missing = t.type === "mc" ? g === null : t.type === "rf" ? g.some((v) => v === null) : t.type === "months" ? g.length !== t.need : !g;
      if (missing) { $("warn").textContent = t.type === "rf" ? "Entscheide dich bei jeder Zeile oder überspringe die Aufgabe." : t.type === "months" ? "Wähle genau zwei Monate oder überspringe die Aufgabe." : "Gib eine Antwort ein oder überspringe die Aufgabe."; return; }
    }
    run.ans[t.id] = skip ? null : g; run.ok[t.id] = skip ? false : grade(t, g);
    if (run.round === 2) { run.qpos++; if (run.qpos >= run.q.length) finish(false); else { save(); renderTask(); } return; }
    run.pos++;
    if (run.pos >= T.length) {
      const open = run.order.filter((id) => run.ans[id] === null);
      if (open.length && left() > 0) { run.round = 2; run.q = open; run.qpos = 0; save(); renderTask(); } else finish(false);
    } else { save(); renderTask(); }
  }
  function finish(timeout) {
    clearInterval(tick);
    if (timeout) run.reached = run.round === 2 ? T.length : run.pos;
    for (const id of run.order) if (!(id in run.ans)) { run.ans[id] = null; run.ok[id] = false; }
    run.pos = T.length; run.timeout = timeout; run.end = timeout ? run.start + LIMIT : Date.now(); save();
    renderResult();
  }

  function renderResult() {
    clearInterval(tick);
    const n = T.length, r = T.filter((t) => run.ok[t.id]).length;
    const stats = TKEYS.map((k) => { const l = T.filter((t) => t.topic === k), ok = l.filter((t) => run.ok[t.id]).length; return { k, ok, n: l.length, p: l.length ? ok / l.length : 0 }; }).filter((x) => x.n > 0);
    const got = stats.filter((s) => s.p >= PASS).length;
    const used = run.end - run.start, mins = Math.floor(used / 60000), secs = Math.floor((used % 60000) / 1000);
    const notReached = run.timeout ? T.length - run.reached : 0;
    $("result").innerHTML = `
      <div class="topnav"><button class="home" data-act="home">Startseite</button></div>
      <h1 style="margin-top:12px">Deine Auswertung</h1><p class="who">${POOLS[run.pool].name}</p>
      <div class="score"><span class="big">${r}</span><span class="of">von ${n} Aufgaben richtig</span></div>
      <p class="meta">${run.timeout ? `Die ${LIMIT / 60000} Minuten sind abgelaufen${notReached ? `, ${notReached} ${notReached === 1 ? "Aufgabe" : "Aufgaben"} blieb${notReached === 1 ? "" : "en"} offen` : ""}.` : `Du hast ${mins} min ${secs} s von ${LIMIT / 60000} Minuten gebraucht.`} Du hast ${got} von ${stats.length} Kompetenzen erreicht.</p>
      <h2 class="sec" style="margin-top:8px">Deine Kompetenzen</h2>
      <ul class="comps">${stats.map((s) => { const ok = s.p >= PASS; return `<li><div class="h"><span>${TOPICS[s.k][0]}</span><span class="chip ${ok ? "ok" : "bad"}">${ok ? "Erreicht" : "Noch ausbaufähig"}</span></div><div class="b ${ok ? "ok-b" : "bad-b"}"><div style="width:${s.p * 100}%"></div></div><p class="n">${s.ok} von ${s.n} Aufgaben richtig</p>${ok ? "" : `<p class="tip">${TOPICS[s.k][1]}</p>`}</li>`; }).join("")}</ul>
      <section class="t-sec codes" style="margin-top:28px"><h2>Ergebnis an deine Lehrkraft schicken</h2><p class="sub">Kopiere diesen Code und schick ihn deiner Lehrkraft (zum Beispiel im Chat oder per Teams). Darin stehen dein Name und dein Ergebnis.</p><textarea id="myCode" readonly rows="5">${makeCode()}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="copycode">Code kopieren</button><span class="msg" id="copyMsg"></span></div></section>
      <div class="row" style="margin-top:28px"><button class="btn" data-act="solutions">Lösungen ansehen</button><button class="btn ghost" data-act="home">Neuer Test</button></div>`;
    show("result");
  }
  function renderReview(i) {
    const id = run.order[i], t = byId(id), g = run.ans[id], ok = run.ok[id];
    const msg = g == null ? (run.timeout && i >= run.reached ? "Für diese Aufgabe war keine Zeit mehr." : "Diese Aufgabe hast du übersprungen.") : ok ? "Deine Antwort war richtig." : t.type === "num" ? `Deine Antwort: ${esc(g)} ${t.unit || ""}. Das stimmt leider nicht.` : "Deine Antwort war leider nicht richtig.";
    $("review").innerHTML = `
      <div class="bar"><div class="barrow"><button class="home" data-act="home">Startseite</button><span style="margin-right:auto">Aufgabe ${i + 1} von ${T.length}</span><button class="link" data-act="result" style="padding:0">Zur Auswertung</button></div></div>
      ${taskBody(t, g, true)}
      <p class="yours ${ok ? "ok" : "bad"}">${msg}</p>
      <div class="sol"><h3>So geht’s</h3>${t.sol}</div>
      <div class="foot"><button class="link" ${i > 0 ? `data-rev="${i - 1}"` : "disabled"}>Vorherige</button><button class="btn" ${i < T.length - 1 ? `data-rev="${i + 1}"` : `data-act="result"`}>${i < T.length - 1 ? "Nächste" : "Zur Auswertung"}</button></div>`;
    show("review");
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button, tr[data-det]"); if (!el || el.disabled) return;
    if (el.dataset.det) { tDetail = el.dataset.det; tAskDel = false; renderTeacher(); return; }
    const a = el.dataset.act;
    if (a === "copycode") { copyText($("myCode").value, $("myCode"), $("copyMsg")); return; }
    if (a === "thome") { location.hash = ""; return; }
    if (a === "tadd") {
      const found = ($("codeIn").value.match(/IKM-[A-Za-z0-9_-]+/g) || []);
      const ok = found.filter((c) => readCode(c)), before = tEntries().length;
      ok.forEach((c) => { if (!tcodes.includes(c)) tcodes.push(c); });
      saveCodes(); const added = tEntries().length - before;
      tMsg = !found.length ? "Kein Code gefunden. Er beginnt mit IKM-." : `${added} neu, ${found.length - ok.length ? (found.length - ok.length) + " ungültig, " : ""}${ok.length - added} schon vorhanden.`;
      renderTeacher(); return;
    }
    if (a === "tclose") { tDetail = null; tAskDel = false; renderTeacher(); return; }
    if (a === "taskdel") { tAskDel = true; renderTeacher(); return; }
    if (a === "tdel") { const e0 = tEntries().find((x) => keyOf(x) === tDetail); if (e0) tcodes = tcodes.filter((c) => { const o = readCode(c); return !o || keyOf(o) !== tDetail; }); saveCodes(); tDetail = null; tAskDel = false; renderTeacher(); return; }
    if (a === "taskall") { tAskAll = true; renderTeacher(); return; }
    if (a === "tdelall") { tcodes = []; saveCodes(); tAskAll = false; tDetail = null; renderTeacher(); return; }
    if (a === "tsv") { copyText(tsv(), $("tsvBox"), $("tsvMsg")); return; }
    if (el.dataset.pool) { readPerson(); selPool = el.dataset.pool; renderStart(); return; }
    if (a === "abandon") { run = null; try { localStorage.removeItem(KEY); } catch (e) { /* egal */ } renderStart(); return; }
    if (a === "start") { readPerson(); if (person.name.length < 2) { $("startWarn").textContent = "Bitte gib deinen Namen ein."; $("inName").focus(); return; } T = POOLS[selPool].tasks; LIMIT = POOLS[selPool].minutes * 60000; run = { name: person.name, klasse: person.klasse, pool: selPool, order: shuffle(T.map((t) => t.id)), pos: 0, ans: {}, ok: {}, start: Date.now(), end: null }; save(); renderTask(); return; }
    if (a === "resume") { renderTask(); return; }
    if (a === "home") { renderStart(); return; }
    if (a === "result") { renderResult(); return; }
    if (a === "solutions") { renderReview(0); return; }
    if (a === "next") { next(false); return; }
    if (a === "skip") { next(true); return; }
    if (el.dataset.rev !== undefined) { renderReview(+el.dataset.rev); return; }
    if ($("task").hidden) return;
    if ($("warn")) $("warn").textContent = "";
    if (el.dataset.o !== undefined) { sel = +el.dataset.o; document.querySelectorAll("#sheet .opt").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.o === sel))); return; }
    if (el.dataset.r !== undefined) { const i = +el.dataset.r, k = +el.dataset.k; sel[i] = k; document.querySelectorAll(`#sheet [data-r="${i}"]`).forEach((b) => { const on = +b.dataset.k === k; b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "✓" : ""; }); return; }
    if (el.dataset.m !== undefined) { const i = +el.dataset.m, p = sel.indexOf(i); if (p >= 0) sel.splice(p, 1); else sel.push(i); el.setAttribute("aria-pressed", String(sel.includes(i))); return; }
  });
  const current = () => (!$("task").hidden ? "task" : "other");
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "numIn") next(false); });

  window.addEventListener("hashchange", () => { if (isTeacher()) renderTeacher(); else renderStart(); });
  if (run && (!run.order || run.order.length !== T.length)) run = null;
  if (run && !run.end && left() <= 0) finish(true);
  else renderStart();
  if (isTeacher()) renderTeacher();
})();
</script>
</body>
</html>
